<script>
  // ?motion=full : force le mouvement complet (démonstration, même si le système le réduit)
  try {
    if (/[?&]motion=full(&|$)/.test(location.search)) sessionStorage.setItem('gallerie:motion', 'full');
    if (sessionStorage.getItem('gallerie:motion') === 'full') document.documentElement.setAttribute('data-motion', 'full');
  } catch (e) {}
  // Thème avant le premier rendu : nuit si le soleil est couché à Jacmel (approximation, affinée ensuite).
  try {
    var p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Port-au-Prince', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date());
    var h = 0, m = 0;
    for (var i = 0; i < p.length; i++) { if (p[i].type === 'hour') h = +p[i].value % 24; if (p[i].type === 'minute') m = +p[i].value; }
    var t = h + m / 60;
    if (t < 6.2 || t >= 18.9) {
      document.documentElement.setAttribute('data-theme', 'nuit');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1430');
    }
  } catch (e) {}
</script>
